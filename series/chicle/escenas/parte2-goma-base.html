let lastPh=-1;
function captions(t){let pi=PH.findIndex(p=>t>=p[0]&&t<p[1]+0.35);
  if(pi!==lastPh){cap.innerHTML=pi<0?'':PH[pi][2].map(w=>'<span'+(w[1]?' class="k"':'')+'>'+w[0]+'</span>').join(' ');lastPh=pi;}
  if(pi>=0){const p=PH[pi];const n=p[2].length;const d=(p[1]-p[0]-0.4)/n;cap.querySelectorAll('span').forEach((s,i)=>{const on=t>=p[0]+i*d;s.className=(p[2][i][1]?'k ':'')+(on?'on':'');});
    cap.style.opacity=t>p[1]?clamp(1-(t-p[1])/0.35):1;}
  const c=CALL.find(c=>t>=c[0]&&t<c[1]);
  if(c){const q=clamp((t-c[0])/0.3);const out=clamp((c[1]-t)/0.25);const pr=c[3]().project(camera);const x=(pr.x+1)/2*W,y=(1-pr.y)/2*H;
    const ex=x+c[4]*150,ey=y+(c[5]===undefined?-150:c[5]);dot.style.left=(x-7)+'px';dot.style.top=(y-7)+'px';
    const L=Math.hypot(ex-x,ey-y)*q;line.style.left=x+'px';line.style.top=(y-1.5)+'px';line.style.width=L+'px';line.style.transform='rotate('+Math.atan2(ey-y,ex-x)+'rad)';
    call.textContent=c[2];call.style.left=Math.max(24,Math.min(W-24-call.offsetWidth,(c[4]>0?ex:ex-call.offsetWidth)))+'px';call.style.top=(ey-22)+'px';
    const op=Math.min(q,out);[dot,line,call].forEach(e=>e.style.opacity=op);call.style.transform='scale('+(0.8+0.2*q)+')';}
  else [dot,line,call].forEach(e=>e.style.opacity=0);}

const FLASH=[3,18,26,30];
function lightAt(x){sun.position.set(x+6,12,9);sun.target.position.set(x,0,0);sun.target.updateMatrixWorld();}
function camTo(t,keys){ // keys: [t, pos, look] → al llegar a t, viaja a ese encuadre en 0,9 s
  let i=0;while(i<keys.length-1&&t>=keys[i+1][0])i++;const b=keys[i],a=keys[Math.max(0,i-1)];
  const k=ease(clamp((t-b[0])/0.9));
  camera.position.copy(a[1]).lerp(b[1],k);camera.lookAt(a[2].clone().lerp(b[2],k));}

window.renderFrame=function(t){
  const sec=t<18?'lab':t<26?'kettle':t<30?'secret':'end';
  const dark=sec==='secret'||sec==='end';
  scene.background.copy(dark?DARK:HALL);scene.fog.color.copy(dark?DARK:HALL);
  hemi.intensity=dark?0.55:1.15;sun.intensity=dark?2.2:1.7;
  lightAt(sec==='lab'?0:sec==='kettle'?KX:sec==='secret'?RX:EX);

  // cámara
  if(sec==='lab'){
    if(t<3){camera.position.set(lerp(-0.6,0,t/3),2.3,lerp(8.4,7.8,t/3));camera.lookAt(0,1.0,1.4);}
    else{const base=[[3,v3(5.6,3.4,2.6),v3(-1.2,1.0,-0.2)]];BX.forEach((x,i)=>base.push([6+i*3,v3(x+0.5,2.25,3.9),v3(x-0.1,1.45,0)]));camTo(t,base);}}
  else if(sec==='kettle'){camTo(t,[[18,v3(KX+0.4,4.4,10.2),v3(KX,1.8,0)],[22,v3(SX+0.4,2.1,5.2),v3(SX,1.0,0.3)]]);}
  else if(sec==='secret'){const k=(t-26)/4;camera.position.set(RX+lerp(-0.4,0.3,k),2.5,lerp(4.4,3.9,k));camera.lookAt(RX,1.05,0.1);}
  else {const k=(t-30)/5;camera.position.set(EX+lerp(0.4,0,k),1.6,lerp(5.6,4.8,k));camera.lookAt(EX,0.9,0);}

  // bolita que entra
  ball.visible=t<3;if(t<3){const k=ease(clamp(t/2.2));ball.position.set(lerp(-4.5,0,k),0.42+Math.abs(Math.sin(k*Math.PI*3))*0.3*(1-k),2.2);ball.rotation.set(0,0,-k*9);}

  // laboratorio
  rubber.position.set(BX[0],fall(t,6.3,4.5,TY+0.25),0);rubber.rotation.y=0.3;rubber.visible=t>6.3;
  const tk=back(clamp((t-6.9)/0.4));tire.scale.setScalar(Math.max(0.001,tk));tire.visible=t>6.9;
  resin.forEach(m=>{const u=m.userData;m.visible=t>u.t0;m.position.set(BX[1]+u.x,fall(t,u.t0,4.2,u.y1),u.z);m.rotation.set(u.r,u.r*2,0);});
  wax.forEach(m=>{const u=m.userData;m.visible=t>u.t0;const y=fall(t,u.t0,4.2,u.y1);m.position.set(BX[2]+u.x+(y>u.y1?Math.sin(t*6+u.r)*0.08:0),y,u.z);m.rotation.set(y>u.y1?t*3:0,u.r,0);});
  const pk=clamp((t-15.3)/0.4),pout=t<16.9;bottle.visible=t>15.0&&t<17.4;bottle.position.set(BX[3]-0.35,TY+1.75,0);bottle.rotation.z=-lerp(0,2.0,pk)*(t<16.9?1:clamp((17.4-t)/0.5));
  const pouring=t>15.5&&pout;stream.visible=pouring;const lvl=clamp((t-15.6)/1.3)*0.55;soft.scale.y=Math.max(0.001,lvl);soft.visible=lvl>0.001;
  if(pouring){const top=TY+1.55,bot=TY+0.02+lvl;stream.scale.y=top-bot;stream.position.set(BX[3]-0.05,(top+bot)/2,0);}

  // caldera
  const mk=clamp((t-18.3)/3.0);rotor.rotation.y=t*2.4;
  chunks.forEach(m=>{const u=m.userData;const a=u.a+t*u.sp*0.6;m.position.set(Math.cos(a)*u.r,0.15+0.2+u.y*(1-mk)*0.6+mk*0.6,-Math.sin(a)*u.r);m.rotation.set(t*2,t,0);const s=Math.max(0.001,1-clamp((t-19.2)/1.8));m.scale.setScalar(s);m.visible=s>0.01;});
  melt.scale.y=lerp(0.35,1.05,mk);meltMat.color.set('#bdb3a0').lerp(new THREE.Color('#efe3c4'),mk);
  bubs.forEach(b=>{const u=b.userData;const q=((t*1.2+u.ph)%1);b.position.set(u.x,0.15+melt.scale.y+0.01,u.z);b.scale.setScalar(Math.sin(q*Math.PI)*mk);});
  heat.material.color.set('#ff7a1a').lerp(new THREE.Color('#ffd24a'),0.5+0.5*Math.sin(t*6));
  steam.forEach(s=>{const u=s.userData;const q=((t*0.5+u.ph)%1);s.position.set(u.x*(1+q*0.5),2.4+q*2.2,u.z);s.scale.setScalar(0.4+q);s.material.opacity=0.8*(1-q)*mk;});
  const flow=t>22.3;pellets.forEach(p=>{const u=p.userData;const q=((t*1.4+u.ph)%1);p.visible=flow;p.position.set(SX+u.dx*q,lerp(1.6,0.62+clamp((t-22.3)/3.5)*0.25,q*q),0.3+u.dz*q);});
  pile.scale.y=lerp(0.25,0.75,clamp((t-22.3)/3.5));pile.position.y=0.5+clamp((t-22.3)/3.5)*0.1;

  // receta
  const lk=clamp((t-26.4)/0.5);lock.scale.setScalar(0.62);lock.position.set(RX+0.5,lerp(2.6,1.15,lk*lk)+ (lk>=1?Math.abs(Math.sin((t-26.9)*9))*0.12*Math.max(0,1-(t-26.9)*2):0),0.55);
  lock.rotation.set(-0.15,0.15,Math.sin(t*5)*0.04*(t>27.2?1:0));lock.visible=t>26.2;

  // bolita sin sabor
  const hop=clamp((t-30.6)/0.7);const chew=t>31.3&&t<32.6;
  hero.position.set(EX-0.4+hop*0.5,0.3+0.7+Math.sin(hop*Math.PI)*0.6,0);
  const sq=chew?1+0.12*Math.sin((t-31.3)*16):1;hb.scale.set(sq,1/sq,sq);
  pellet.visible=t<31.3;pellet.position.set(EX+0.75,0.3+0.26,0.3);pellet.scale.setScalar(t>31.0?Math.max(0.001,1-(t-31)/0.3):1);
  const bored=clamp((t-32.6)/0.4);eyes.forEach(e=>e.scale.set(1,lerp(1,0.35,bored),1));
  mouth.scale.set(lerp(0.6,1.2,bored),1,1);hero.rotation.y=Math.sin(t*1.2)*0.08;
  dots.forEach((d,i)=>{const on=clamp((t-33.0-i*0.35)/0.2);d.visible=on>0;d.scale.setScalar(Math.max(0.001,back(on)));d.position.set(hero.position.x-0.28+i*0.28,hero.position.y+1.05,0.3);});

  renderer.render(scene,camera);
  captions(t);
  let fo=0;FLASH.forEach(x=>{const d=Math.abs(t-x);if(d<0.3)fo=Math.max(fo,1-d/0.3);});
  fade.style.opacity=fo;
};
window.renderFrame(0);
</script>
</body>
</html>
