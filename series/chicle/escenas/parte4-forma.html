const cap=document.getElementById('cap'),call=document.getElementById('call'),dot=document.getElementById('dot'),line=document.getElementById('line'),fade=document.getElementById('fade');

  const c=CALL.find(c=>t>=c[0]&&t<c[1]);
  if(c){const q=clamp((t-c[0])/0.3);const out=clamp((c[1]-t)/0.25);const pr=c[3]().project(camera);const x=(pr.x+1)/2*W,y=(1-pr.y)/2*H;
    const ex=x+c[4]*150,ey=y+(c[5]===undefined?-150:c[5]);dot.style.left=(x-7)+'px';dot.style.top=(y-7)+'px';
    const L=Math.hypot(ex-x,ey-y)*q;line.style.left=x+'px';line.style.top=(y-1.5)+'px';line.style.width=L+'px';line.style.transform='rotate('+Math.atan2(ey-y,ex-x)+'rad)';
    call.textContent=c[2];call.style.left=Math.max(24,Math.min(W-24-call.offsetWidth,(c[4]>0?ex:ex-call.offsetWidth)))+'px';call.style.top=(ey-22)+'px';
    const op=Math.min(q,out);[dot,line,call].forEach(e=>e.style.opacity=op);call.style.transform='scale('+(0.8+0.2*q)+')';}
  else [dot,line,call].forEach(e=>e.style.opacity=0);}
function camTo(t,keys){let i=0;while(i<keys.length-1&&t>=keys[i+1][0])i++;const b=keys[i],a=keys[Math.max(0,i-1)];
  const k=ease(clamp((t-b[0])/(b[3]||1.0)));camera.position.copy(a[1]).lerp(b[1],k);camera.lookAt(a[2].clone().lerp(b[2],k));}
const CAM=[[0,v3(-0.6,4.8,6.2),v3(-1.1,2.8,0)],[3,v3(-0.2,2.9,7.6),v3(-0.2,2.0,0)],[7,v3(3.4,4.4,4.6),v3(2.6,1.3,0)],
  [10,v3(5.0,4.6,4.8),v3(4.6,1.1,0)],[13,v3(7.6,2.9,4.6),v3(6.5,1.2,0)],[16,v3(12.1,2.4,9.6),v3(12.1,2.1,0),1.4],
  [20,v3(14.6,2.6,5.0),v3(14.8,1.9,0)],[23,v3(16.3,2.3,4.4),v3(16.3,1.6,0)],[27,v3(16.9,2.45,1.05),v3(16.85,1.42,0)],
  [31,v3(18.7,2.8,5.2),v3(18.6,0.9,0)],[35,v3(21.8,3.6,13.5),v3(22.4,1.3,0),1.3]];
const tmp=v3(0,0,0);

window.renderFrame=function(t){
  camTo(t,CAM);sun.position.set(camera.position.x+5,12,9);sun.target.position.set(camera.position.x,0,0);
  // extrusora
  screw.rotation.x=-t*3.2;lump.scale.setScalar(Math.max(0.35,1-clamp((t-2.5)/14)*0.6));lump.rotation.y=t*0.4;lump.position.y=BY+1.5-clamp((t-2.5)/14)*0.4;
  // cuerdas que salen
  const grow=clamp((t-3.6)/3.8);
  [ropeA,...others].forEach(m=>{const n=m.userData.n;m.geometry.setDrawRange(0,Math.floor(n*(m===ropeA?grow:clamp((t-3.6)/7))/6)*6);});
  slats.forEach((s,i)=>{const x=2.05+((i/26)*7.7+t*0.9)%7.7;s.position.set(x,1.065,0);});
  tslats.forEach(s=>{const u=s.userData;const q=(u.ph+t*0.25*u.dir+10)%1;s.position.set(10.1+q*4.0,u.y+0.005,0);});
  guides.forEach((g,i)=>g.rotation.y=t*6*(i%2?1:-1));
  cold.forEach(c=>{const u=c.userData;const x=TX0+0.1+((u.x-t*0.08)%1+1)%1*(TX1-TX0-0.2);c.position.set(x,u.y+Math.sin(t*1.5+u.ph)*0.08,u.z);c.rotation.set(t,t*1.3,0);});
  // cortadora
  knife.rotation.z=-t*9;
  const s0=t/PER;
  pieces.forEach((pc,i)=>{const q=((s0+i)/PIECES)%1;const x=CX-0.5+q*1.4;const d=x-CX;
    pc.gr.position.set(x,CY,0);
    const paper=d>-0.05;pc.base.visible=paper;
    const f=clamp((d-0.1)/0.3),f1=ease(clamp(f/0.5)),f2=ease(clamp((f-0.5)/0.5));
    pc.flaps.forEach(fl=>{fl.p.visible=paper;fl.p.rotation.x=fl.s*lerp(Math.PI/2,0,f1);fl.tp.rotation.x=-fl.s*lerp(0,Math.PI/2,f2);});
    const tw=clamp((d-0.42)/0.16);pc.ends.forEach(c=>{c.visible=tw>0;c.scale.setScalar(Math.max(0.001,back(tw)));c.rotation.x=tw*Math.PI*3;});});
  stripRoll.rotation.z=t*2;
  // caen al cubo
  const fill=clamp((t-29)/8);pile.scale.set(1,lerp(0.25,0.85,fill),1);pile.position.y=0.3+fill*0.25;ptex.offset.set(t*0.2,0);
  falling.forEach(w=>{const u=w.userData;const q=((t*0.9+u.ph)%1);let p;
    if(q<0.4){const k=q/0.4;p=v3(lerp(CX+1.0,CX+2.0,k),lerp(1.32,0.88,k)+0.08,u.dz*0.3);}
    else{const k=(q-0.4)/0.6;p=v3(lerp(CX+2.0,TUBX+u.dx,k),lerp(0.96,0.45+fill*0.3,k*k),lerp(u.dz*0.3,u.dz,k));}
    w.position.copy(p);w.rotation.set(u.r+t*3*(q>0.4?1:0),u.r,q<0.4?-0.45:u.r);});
  // la bolita-taquito especial salta del cubo a la caja
  const sk=clamp((t-35.2)/0.9);star.visible=t>35.0&&t<36.5;
  star.position.set(lerp(TUBX,BXX,sk),lerp(1.0,0.75,sk)+Math.sin(sk*Math.PI)*1.3,0);star.rotation.set(t*4,t*3,0);star.scale.setScalar(1.6+0.2*Math.sin(t*10));
  const close=clamp((t-36.1)/0.5);
  flaps[0].rotation.x=lerp(2.3,Math.PI,close);flaps[1].rotation.x=lerp(-2.3,-Math.PI+Math.PI,close);
  const mv=ease(clamp((t-36.7)/0.9));const tx=truck.position.x;
  cbox.position.set(lerp(BXX,tx-0.6,mv),Math.sin(mv*Math.PI)*0.9+mv*0.55,0);cbox.visible=t<37.6;
  const drive=clamp((t-37.9)/2.1);truck.position.x=BXX+2.8+drive*drive*3.5;
  wheels.forEach(w=>{w.rotation.set(Math.PI/2,-drive*drive*11,0);});

  renderer.render(scene,camera);
  captions(t);
  fade.style.opacity=0;
};
window.renderFrame(0);
</script>
