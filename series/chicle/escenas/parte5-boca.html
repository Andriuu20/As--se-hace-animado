<script>

for(let i=0;i<=8;i++){gg.beginPath();gg.moveTo(i*32,0);gg.lineTo(i*32,256);gg.stroke();gg.beginPath();gg.moveTo(0,i*32);gg.lineTo(256,i*32);gg.stroke();}
const gtex=new THREE.CanvasTexture(gc);gtex.wrapS=gtex.wrapT=THREE.RepeatWrapping;gtex.repeat.set(4,7);gtex.colorSpace=THREE.SRGBColorSpace;
const grid=new THREE.Mesh(new THREE.PlaneGeometry(10,18),new THREE.MeshBasicMaterial({map:gtex}));grid.position.z=-2.5;mouth.add(grid);

const toothMat=new THREE.MeshLambertMaterial({color:'#f4f8ff',emissive:'#2a3a55',flatShading:true});

  const gum=box(3.0,0.5,0.9,'#e0566e',j);gum.position.set(0,sign*0.45,-0.2);
  for(let i=0;i<6;i++){const x=-1.25+i*0.5;const tt=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.5,0.42),toothMat);tt.position.set(x,sign*0.05,0.1-Math.abs(x)*0.18);tt.castShadow=true;j.add(tt);}
  return j;}
const upper=jaw(1),lower=jaw(-1);
const tongue=new THREE.Mesh(new THREE.SphereGeometry(1,16,10),flat('#ff8fa3'));tongue.scale.set(1.15,0.35,0.8);tongue.position.set(0,-0.9,-0.6);mouth.add(tongue);

const saliva=[];for(let i=0;i<22;i++){const s=new THREE.Mesh(new THREE.SphereGeometry(0.07,10,8),new THREE.MeshLambertMaterial({color:'#9fdcff',transparent:true,opacity:0.8}));s.userData={a:rnd()*6.28,r:1.5+rnd()*0.8,ph:rnd()};mouth.add(s);saliva.push(s);}
const leave=[];const cols=['#ffffff','#ffffff','#ffffff','#FFD54A','#7be08a','#ffa64d','#ff6fae'];

  const a=i/13*6.28;b.userData.tx=Math.cos(a)*0.45*(i%3?1:0.3);b.userData.ty=-0.1+Math.sin(a)*0.45*(i%3?1:0.3);b.userData.tz=(i%2)*0.3;many.push(b);}

// ---------- RESUMEN (x=500) ----------
const RX=500;const steps=[];
const st=[[RX-0.7,2.4],[RX+0.7,1.1],[RX-0.7,-0.2],[RX+0.7,-1.3]];
{const tr=new THREE.Group();tr.position.set(st[0][0],st[0][1]-0.6,0);scene.add(tr);cyl(0.1,0.14,0.8,'#8a5a34',tr,7).position.y=0.4;const c=new THREE.Mesh(new THREE.IcosahedronGeometry(0.55,0),flat('#4e8f3a'));c.position.y=1.0;tr.add(c);steps.push(tr);}
{const f=new THREE.Group();f.position.set(st[1][0],st[1][1]-0.6,0);scene.add(f);box(1.1,0.7,0.6,'#b8b2a8',f).position.y=0.35;box(1.15,0.12,0.65,'#8d4a3a',f).position.y=0.75;cyl(0.1,0.13,0.9,'#8d4a3a',f,8).position.set(0.35,0.95,0);steps.push(f);}
{const m=new THREE.Group();m.position.set(st[2][0],st[2][1]-0.6,0);scene.add(m);cyl(0.5,0.5,0.7,'#dfe4ea',m,20).position.y=0.45;const top=cyl(0.52,0.52,0.08,'#f39a3d',m,20);top.position.y=0.82;const pk=cyl(0.42,0.42,0.05,'#ff79b3',m,20);pk.position.y=0.79;steps.push(m);}
{const mo=new THREE.Group();mo.position.set(st[3][0],st[3][1]-0.2,0);scene.add(mo);const lip=new THREE.Mesh(new THREE.TorusGeometry(0.5,0.13,8,24),flat('#e0566e'));lip.scale.set(1,0.6,1);mo.add(lip);
  for(let i=0;i<4;i++){const tt=box(0.16,0.16,0.08,'#ffffff',mo);tt.position.set(-0.24+i*0.16,0.14,0);}steps.push(mo);}
const recapBall=gumBall(0.3);
const arrows=[];for(let i=0;i<3;i++){const a=new THREE.Mesh(new THREE.ConeGeometry(0.12,0.3,10),flat('#FFD54A'));const p0=st[i],p1=st[i+1];a.position.set((p0[0]+p1[0])/2,(p0[1]+p1[1])/2,0);a.rotation.z=Math.atan2(p1[1]-p0[1],p1[0]-p0[0])-Math.PI/2;scene.add(a);arrows.push(a);}

// ---------- TEXTOS ----------
const PH=[
 [0.3,2.8,[['¿Por'],['qué'],['el'],['chicle'],['pierde',1],['el',1],['sabor?',1]]],
 [3.2,5.8,[['Todo'],['empieza'],['cuando'],['lo'],['compras.',1]]],
 [6.2,8.8,[['Al'],['masticar,'],['la'],['saliva',1],['se'],['pone'],['a'],['trabajar.']]],

 [16.2,18.8,[['Por'],['eso'],['al'],['rato'],['solo'],['queda'],['goma,'],['sin',1],['sabor.',1]]],
 [19.2,21.8,[['¿Y'],['si'],['te'],['lo'],['tragas'],['se'],['queda'],['7',1],['años',1],['dentro?']]],

 [32.2,34.8,[['Del'],['árbol'],['a'],['tu',1],['boca.',1]]],

const CALL=[
 [6.8,9.0,'SALIVA',()=>saliva[3].getWorldPosition(v3()),1,-120],
 [9.8,12.9,'AZÚCAR Y AROMA',()=>chewBall.getWorldPosition(v3()).add(v3(0.6,0.5,0)),1,-200],
 [13.8,16.0,'GOMA BASE',()=>chewBall.getWorldPosition(v3()),-1,-230]];
const cap=document.getElementById('cap'),call=document.getElementById('call'),dot=document.getElementById('dot'),line=document.getElementById('line'),fade=document.getElementById('fade');
const qEl=document.getElementById('q'),myth=document.getElementById('myth'),stamp=document.getElementById('stamp'),xray=document.getElementById('xray');
let lastPh=-1;
function captions(t){let pi=PH.findIndex(p=>t>=p[0]&&t<p[1]+0.35);
  if(pi!==lastPh){cap.innerHTML=pi<0?'':PH[pi][2].map(w=>'<span'+(w[1]?' class="k"':'')+'>'+w[0]+'</span>').join(' ');lastPh=pi;}
  if(pi>=0){const p=PH[pi];const n=p[2].length;const d=(p[1]-p[0]-0.4)/n;cap.querySelectorAll('span').forEach((s,i)=>{const on=t>=p[0]+i*d;s.className=(p[2][i][1]?'k ':'')+(on?'on':'');});
    cap.style.opacity=t>p[1]?clamp(1-(t-p[1])/0.35):1;}
  const c=CALL.find(c=>t>=c[0]&&t<c[1]);
  if(c){const q=clamp((t-c[0])/0.3);const out=clamp((c[1]-t)/0.25);const pr=c[3]().project(camera);const x=(pr.x+1)/2*W,y=(1-pr.y)/2*H;

    const op=Math.min(q,out);[dot,line,call].forEach(e=>e.style.opacity=op);call.style.transform='scale('+(0.8+0.2*q)+')';}
  else [dot,line,call].forEach(e=>e.style.opacity=0);}
const FLASH=[3,6,19,25,29,32,35];
const BG={intro:'#1c1820',shop:'#f6e3c8',mouth:'#10203a',myth:'#1c1820',gut:'#1c1820',many:'#1c1820',recap:'#1c1820'};
const fadeIn=(t,a,b)=>Math.min(clamp((t-a)/0.3),clamp((b-t)/0.3));

window.renderFrame=function(t){
  const sec=t<3||t>=35?'intro':t<6?'shop':t<19?'mouth':t<25?'myth':t<29?'gut':t<32?'many':'recap';
  scene.background.set(BG[sec]);
  const cx={intro:IX,shop:0,mouth:MX,myth:SX,gut:GX,many:NX,recap:RX}[sec];
  sun.position.set(cx+4,10,8);sun.target.position.set(cx,0,0);hemi.intensity=sec==='shop'?1.1:0.9;
  // cámara
  if(sec==='intro'){camera.position.set(IX,0.3,lerp(6.4,6.0,(t%35)/3));camera.lookAt(IX,0.3,0);}
  else if(sec==='shop'){const k=ease(clamp((t-3)/3));camera.position.set(lerp(1.0,0.6,k),lerp(2.6,2.3,k),lerp(8.2,7.2,k));camera.lookAt(0.3,1.3,0);}
  else if(sec==='mouth'){camera.position.set(MX,-0.3,lerp(9.6,8.8,(t-6)/13));camera.lookAt(MX,-0.3,0);}
  else if(sec==='myth'){camera.position.set(SX,0.2,8.0);camera.lookAt(SX,0.2,0);}
  else if(sec==='gut'){camera.position.set(GX+0.3,-0.2,10.2);camera.lookAt(GX,-0.3,0);}
  else if(sec==='many'){camera.position.set(NX,0.4,6.6);camera.lookAt(NX,0.4,0);}
  else {camera.position.set(RX,0.1,9.6);camera.lookAt(RX,0.1,0);}

  // intro / final
  const fin=t>=35;
  hero.visible=sec==='intro';hero.position.y=0.1+Math.sin(t*2)*0.08;hero.rotation.y=Math.sin(t*1.2)*0.3;
  hero.scale.setScalar(back(clamp((fin?t-35:t)/0.5)));face(hero,fin?'happy':'none');
  sparks.forEach(s=>{const u=s.userData;const a=u.a+t*u.sp;s.position.set(IX+Math.cos(a)*u.r,u.y+Math.sin(t+u.a)*0.15,Math.sin(a)*u.r*0.5);s.visible=sec==='intro';s.rotation.set(t*2,t*3,0);});
  qEl.style.opacity=t<3?fadeIn(t,0.4,2.9):t>=35?fadeIn(t,35.4,38.2):0;qEl.style.transform='rotate('+(Math.sin(t*3)*8)+'deg)';
  // tienda
  const hk=ease(clamp((t-3.3)/1.0)),close=clamp((t-4.3)/0.3),lift=ease(clamp((t-4.6)/1.2));
  const gp=v3(grab.position.x,grab.position.y,grab.position.z);
  hand.position.set(lerp(3.2,gp.x+0.62,hk)+lift*0.5,lerp(2.3,gp.y+0.18,hk)+lift*0.4,lerp(0.6,gp.z+0.05,hk)+lift*1.5);hand.rotation.set(0,Math.PI/2+0.3*(1-hk),0);
  fingers.forEach(f=>f.rotation.x=close*0.9);
  if(t>4.6){grab.position.set(hand.position.x-0.62,hand.position.y-0.18,hand.position.z-0.05);}else grab.position.set(-1.3+2*0.65,1.4+0.2,-0.2+((2+1)%2)*0.05);
  // boca
  xray.style.opacity=sec==='mouth'?fadeIn(t,6.2,18.8):0;
  const chew=t>6.4?0.5+0.5*Math.sin((t-6.4)*5.5-Math.PI/2):0;
  upper.position.y=0.95-chew*0.32;lower.position.y=-0.95+chew*0.32;
  chewBall.position.set(0,0,0.15);chewBall.userData.b.scale.set(1+chew*0.25,1-chew*0.3,1+chew*0.2);
  const grey=clamp((t-13.4)/2.2);chewBall.userData.mat.color.copy(PINK).lerp(GREY,grey);chewBall.userData.mat.emissive.set(grey>0.5?'#1a1a1a':'#4a0e28');
  face(chewBall,t>16.2?'bored':'none');chewBall.rotation.y=Math.sin(t*1.5)*0.2;
  saliva.forEach(s=>{const u=s.userData;const on=clamp((t-6.4)/0.6);const q=((t*0.5+u.ph)%1);const r=lerp(u.r,0.5,q);s.position.set(Math.cos(u.a)*r,Math.sin(u.a)*r*0.8,0.5);s.visible=on>0;s.scale.setScalar(on*(1-q*0.5));});
  leave.forEach(p=>{const u=p.userData;const ft=t-u.t0;p.visible=ft>0&&ft<1.6;if(p.visible){const d=0.4+ft*u.sp;p.position.set(Math.cos(u.a)*d,Math.sin(u.a)*d*0.7+u.e*0.2,0.6);p.material.opacity=1-ft/1.6;p.rotation.set(t*3,t*2,0);}});
  // mito
  myth.style.opacity=sec==='myth'?fadeIn(t,19.3,24.8):0;
  const sk=clamp((t-22.2)/0.35);stamp.style.opacity=t>22.2&&t<24.8?Math.min(1,sk*3):0;stamp.style.transform='rotate(-12deg) scale('+lerp(2.2,1,back(sk))+')';
  face(mythBall,'bored');mythBall.userData.mat.color.copy(GREY);mythBall.userData.mat.emissive.set('#1a1a1a');mythBall.position.y=-1.0+Math.sin(t*2)*0.06;
  // tubo
  const gk=ease(clamp((t-25.4)/3.2));gutBall.position.copy(gutCurve.getPointAt(Math.min(0.999,gk)));if(t>28.6)gutBall.position.y-=(t-28.6)*2;
  gutBall.userData.mat.color.copy(GREY);gutBall.userData.mat.emissive.set('#1a1a1a');face(gutBall,'happy');gutBall.visible=sec==='gut';
  arrowG.position.y=-3.55-Math.abs(Math.sin(t*4))*0.12;
  // muchos
  many.forEach((b,i)=>{const u=b.userData;const k=ease(clamp((t-29.3-i*0.04)/1.0));
    const sx=NX+Math.cos(u.a)*u.r,sy=u.y;b.position.set(lerp(sx,NX+u.tx,k),lerp(sy,u.ty,k),u.tz);b.visible=sec==='many';
    b.userData.mat.color.copy(PINK).lerp(GREY,0.6);face(b,i%3?'none':'bored');b.rotation.y=Math.sin(t*2+i)*0.3;});
  const wk=clamp((t-30.4)/0.35);warn.scale.setScalar(Math.max(0.001,back(wk)*0.75));warn.rotation.z=Math.sin(t*6)*0.05*wk;warn.visible=t>30.4&&sec==='many';
  // resumen
  steps.forEach((s,i)=>{const on=clamp((t-32.2-i*0.55)/0.3);s.scale.setScalar(Math.max(0.001,back(on)));s.rotation.y=Math.sin(t*1.2+i)*0.25;});
  arrows.forEach((a,i)=>{a.visible=t>32.5+i*0.55;});
  const rq=clamp((t-32.3)/2.3)*3;const ri=Math.min(2,Math.floor(rq));const rf=rq-ri;const p0=st[ri],p1=st[ri+1];
  recapBall.position.set(lerp(p0[0],p1[0],rf),lerp(p0[1],p1[1],rf)+0.55+Math.sin(rf*Math.PI)*0.6,0.7);recapBall.visible=sec==='recap';face(recapBall,'happy');

  renderer.render(scene,camera);
  captions(t);
  let fo=0;FLASH.forEach(x=>{const d=Math.abs(t-x);if(d<0.3)fo=Math.max(fo,1-d/0.3);});
  fade.style.opacity=fo;
};
window.renderFrame(0);
</script>
</body>
</html>
